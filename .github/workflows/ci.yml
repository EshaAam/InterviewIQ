# Every push and pull request. Five independent jobs, so one failure doesn't
# hide another and they run in parallel.
#
#   backend     lint + the full test suite (SQLite, fake provider, no network)
#   migrations  the migration chain against real Postgres — what SQLite can't check
#   retrieval   hybrid search quality against a real pgvector database, with a floor
#   frontend    lint, type-check, unit tests (Vitest), production build
#   e2e         a real browser through a whole interview, against the
#               production backend stack (docker-compose.prod.yml, fake AI)
#   image       both production Docker images build
name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch cancels the older run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.10.6"
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run ruff check app tests scripts
      - run: uv run pytest -q

  migrations:
    runs-on: ubuntu-latest
    services:
      postgres:
        # Must match compose: the chain now includes CREATE EXTENSION vector.
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: interviewiq
          POSTGRES_PASSWORD: interviewiq
          POSTGRES_DB: interviewiq
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U interviewiq"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      POSTGRES_HOST: localhost
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.10.6"
          enable-cache: true
      - run: uv sync --frozen
      - name: Upgrade an empty database to head
        run: uv run alembic upgrade head
      - name: Models and migrations agree (no autogenerate diff)
        run: uv run alembic check
      - name: Every migration reverses
        run: uv run alembic downgrade base
      - name: And applies again from scratch
        run: uv run alembic upgrade head


  retrieval:
    # Hybrid search is Postgres-specific (pgvector + full text), so unlike the
    # backend job this one needs a real database. It guards the numbers rather
    # than just reporting them: a chunking or embedder change that quietly
    # degrades recall fails here instead of surfacing as worse interviews.
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: interviewiq
          POSTGRES_PASSWORD: interviewiq
          POSTGRES_DB: interviewiq
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U interviewiq"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      POSTGRES_HOST: localhost
      LLM_PROVIDER: fake
      EMBEDDING_PROVIDER: local
      HF_HUB_DISABLE_SYMLINKS_WARNING: "1"
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.10.6"
          enable-cache: true
      - run: uv sync --frozen --extra embed
      - run: uv run alembic upgrade head
      - name: Build the knowledge base
        run: uv run python -m app.cli ingest-kb
      - name: Hybrid retrieval must clear the floor
        # 0.90 against a measured 0.967 - enough headroom that an unrelated
        # wording change does not fail the build, tight enough that a real
        # regression does.
        run: uv run python -m app.cli eval-retrieval --floor 0.90

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  e2e:
    runs-on: ubuntu-latest
    env:
      ENV_FILE: ci.env
      API_PORT: "8000"
    steps:
      - uses: actions/checkout@v4
      - name: Settings for a throwaway stack (fake AI, production mode)
        run: |
          cat > ci.env <<EOF
          ENVIRONMENT=production
          SECRET_KEY=$(openssl rand -base64 48)
          POSTGRES_USER=interviewiq
          POSTGRES_PASSWORD=ci-only
          POSTGRES_DB=interviewiq
          LLM_PROVIDER=fake
          FAKE_LATENCY_MS=100
          CORS_ORIGINS=http://localhost:3000
          EOF
      - name: Start the production backend stack
        run: docker compose -f docker-compose.prod.yml up -d --build --wait api worker
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npm run e2e
        working-directory: frontend
      - name: Backend logs (on failure)
        if: failure()
        run: docker compose -f docker-compose.prod.yml logs --tail=200 api worker
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7

  image:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { name: backend, context: backend, target: prod }
          - { name: web, context: frontend, target: prod }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build the ${{ matrix.name }} production image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          target: ${{ matrix.target }}
          push: false
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
