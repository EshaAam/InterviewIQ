[project]
name = "interviewiq-backend"
version = "0.1.0"
description = "InterviewIQ — AI-assisted technical interview platform (FastAPI backend)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic[email]>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy>=2.0",
    "alembic>=1.14",
    "psycopg[binary]>=3.2",
    "redis>=5.2",
    "asyncpg>=0.31.0",
    "pyjwt>=2.13.0",
    "python-multipart>=0.0.32",
    "bcrypt>=5.0.0",
    "celery[redis]>=5.4",
    "google-genai>=2.14.0",
    "pypdf>=6.19.0",
    "python-docx>=1.2.0",
    "fpdf2>=2.8.9",
    # SQLAlchemy type bindings for the pgvector column. Tiny and pure-Python;
    # the extension itself ships with the Postgres image.
    "pgvector>=0.4.1",
]

[project.optional-dependencies]
# The local embedding model (RAG Phase 1). Optional, and installed only in the
# container images: it pulls onnxruntime and adds a few hundred MB, which the
# lint/test CI job has no use for because the suite pins EMBEDDING_PROVIDER=hash.
# fastembed runs the model as ONNX; sentence-transformers would drag in PyTorch
# and roughly 2 GB for the same 384-dim vectors.
embed = [
    "fastembed>=0.7.0",
]
# Local speech-to-text for voice answers (faster-whisper runs Whisper on the CPU
# via CTranslate2; PyAV decodes the browser's webm/opus, no system ffmpeg). Off
# until VOICE_ENABLED=true. av is capped below 16: faster-whisper 1.2 passes
# `metadata_errors` to `av.open`, which newer PyAV removed — decoding fails.
voice = [
    "av>=11,<16",
    "faster-whisper>=1.1.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.28",
    "ruff>=0.8",
    "aiosqlite>=0.22.1",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
