[project]
name = "interviewiq-backend"
version = "0.1.0"
description = "InterviewIQ — AI-assisted technical interview platform (FastAPI backend)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic[email]>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy>=2.0",
    "alembic>=1.14",
    "psycopg[binary]>=3.2",
    "redis>=5.2",
    "asyncpg>=0.31.0",
    "pyjwt>=2.13.0",
    "python-multipart>=0.0.32",
    "bcrypt>=5.0.0",
    "celery[redis]>=5.4",
    "google-genai>=2.14.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.28",
    "ruff>=0.8",
    "aiosqlite>=0.22.1",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
